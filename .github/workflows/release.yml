name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.0）"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Check tag against package version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match Directory.Build.props version 'v$version'."
          }
          "VERSION=$version" | Add-Content -Path $env:GITHUB_ENV -Encoding ascii

      - name: Restore
        run: dotnet restore OODD.Charts.slnx

      - name: Build
        run: dotnet build OODD.Charts.slnx -c Release --no-restore

      # CrossTfmTests / PatternFillProbeTests 需要另一个 TFM 的 PNG 作对照物。
      - name: Warm up net462 cross-TFM evidence
        continue-on-error: true
        run: dotnet test tests/OODD.Charts.Tests/OODD.Charts.Tests.csproj -c Release -f net462 --no-build --filter "FullyQualifiedName~CrossTfmTests|FullyQualifiedName~PatternFillProbeTests"

      - name: Verify net462 evidence exists
        shell: pwsh
        run: |
          foreach ($f in @('artifacts/cross-tfm/net462-temperature-96dpi.png', 'artifacts/pattern-probe/net462-pattern-96dpi.png')) {
            if (-not (Test-Path $f)) { throw "Cross-TFM evidence missing: $f" }
          }

      - name: Test (net8.0)
        run: dotnet test tests/OODD.Charts.Tests/OODD.Charts.Tests.csproj -c Release -f net8.0 --no-build

      - name: Test (net462)
        run: dotnet test tests/OODD.Charts.Tests/OODD.Charts.Tests.csproj -c Release -f net462 --no-build

      - name: Pack
        run: dotnet pack OODD.Charts.slnx -c Release -o artifacts/nuget

      # README 缺失时 pack 不会报错，发布前必须显式拦下。
      - name: Verify package payload
        shell: pwsh
        run: |
          $pkgs = @(Get-ChildItem artifacts/nuget/*.nupkg)
          if ($pkgs.Count -ne 14) { throw "Expected 14 packages, found $($pkgs.Count)." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($p in $pkgs) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($p.FullName)
            try {
              $hasReadme = [bool]($zip.Entries | Where-Object { $_.FullName -eq 'README.md' })
            } finally { $zip.Dispose() }
            if (-not $hasReadme) { throw "Package $($p.Name) is missing README.md." }
          }
          "Verified $($pkgs.Count) packages, each with README.md."

      # 首选 OIDC 短期密钥：仓库变量 NUGET_USER（nuget.org 资料名）+ nuget.org 上的 Trusted Publishing 策略。
      # 仍保留旧式 secret NUGET_API_KEY 作为兜底。
      - name: NuGet login (OIDC → temp API key)
        if: vars.NUGET_USER != '' && env.NUGET_API_KEY == ''
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: vars.NUGET_USER != '' || env.NUGET_API_KEY != ''
        shell: pwsh
        env:
          NUGET_PUSH_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY || env.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:NUGET_PUSH_KEY)) {
            throw "No NuGet credential: set repository variable NUGET_USER or secret NUGET_API_KEY."
          }
          Get-ChildItem artifacts/nuget/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_PUSH_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($_.Name)." }
          }

      - name: NuGet.org push not configured
        if: vars.NUGET_USER == '' && env.NUGET_API_KEY == ''
        run: echo "::warning title=NuGet.org skipped::Set repository variable NUGET_USER (trusted publishing) or secret NUGET_API_KEY to enable publishing."

      # CD 只发布 NuGet 包；WPF 演示 zip 仍按需手工附加。
      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag artifacts/nuget/*.nupkg --title "OODD.Charts $env:VERSION" --generate-notes --verify-tag
          } else {
            gh release upload $tag artifacts/nuget/*.nupkg --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release assets for $tag." }
